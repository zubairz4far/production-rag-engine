services:
  - type: web
    name: production-rag-engine
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /health/live
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "10"
