name: Retrieval Benchmark

on:
  push:
    paths:
      - "app/**"
      - "evals/retrieval_benchmark.json"
      - "evals/retrieval_benchmark_v2.json"
      - "scripts/benchmark_retrieval.py"
      - "pyproject.toml"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run benchmark V1
        run: |
          python scripts/benchmark_retrieval.py \
            --dataset evals/retrieval_benchmark.json \
            --output benchmark_results_v1.json
      - name: Run benchmark V2
        run: |
          python scripts/benchmark_retrieval.py \
            --dataset evals/retrieval_benchmark_v2.json \
            --output benchmark_results_v2.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark-results
          path: |
            benchmark_results_v1.json
            benchmark_results_v2.json
