[project]
name = "production-rag-engine"
version = "1.0.0"
description = "Evaluated hybrid RAG with grounded generation, production observability, and deployment hardening."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "qdrant-client[fastembed]>=1.18,<1.19",
  "pymupdf>=1.24",
  "httpx>=0.27",
  "numpy>=1.26",
  "prometheus-client>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["evals*", "scripts*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["app"]
